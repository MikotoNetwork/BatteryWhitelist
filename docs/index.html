<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电池白名单守护者 | BatteryWhitelist</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --accent: #2ea043;
            --accent-hover: #3fb950;
            --border: #30363d;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .header {
            text-align: center;
            padding: 40px 0 20px 0;
        }
        .icon {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            margin-bottom: 16px;
            box-shadow: 0 0 20px rgba(46, 160, 67, 0.3);
        }
        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #fff;
        }
        .subtitle {
            font-size: 14px;
            color: var(--text-muted);
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            transition: transform 0.2s;
        }
        .card:hover {
            border-color: #8b949e;
        }
        .version-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .version-badge {
            background-color: rgba(46, 160, 67, 0.15);
            color: var(--accent-hover);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }
        .release-date {
            font-size: 12px;
            color: var(--text-muted);
        }
        .changelog {
            font-size: 14px;
            white-space: pre-line;
            margin-bottom: 20px;
            color: var(--text-main);
            border-left: 2px solid var(--border);
            padding-left: 12px;
        }
        .download-btn {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: var(--accent);
            color: #fff;
            text-align: center;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: background-color 0.2s;
        }
        .download-btn:hover {
            background-color: var(--accent-hover);
        }
        .features {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .feature-item {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            text-align: center;
            font-size: 13px;
        }
        .feature-item strong {
            display: block;
            color: var(--accent-hover);
            margin-bottom: 4px;
        }
        .footer {
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            padding: 20px 0;
            border-top: 1px solid var(--border);
            margin-top: 20px;
        }
        .quote {
            font-style: italic;
            margin-top: 10px;
            color: #8b949e;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            
            <img src="https://raw.githubusercontent.com/MikotoNetwork/BatteryWhitelist/main/app/src/main/res/drawable/icon.png" class="icon" alt="Logo" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'><circle cx=\'50\' cy=\'50\' r=\'45\' fill=\'%230d1117\' stroke=\'%232ea043\' stroke-width=\'4\'/><path d=\'M50 25 L60 45 L40 45 L50 75 L40 55 L60 55 Z\' fill=\'%232ea043\'/></svg>'">
            <h1>电池白名单守护者</h1>
            <p class="subtitle">BatteryWhitelist · 夺回属于你的数字主权</p>
        </div>

        <div class="card">
            <div class="version-info">
                <span class="version-badge" id="version-badge">v1.0.0</span>
                <span class="release-date" id="release-date">----/--/--</span>
            </div>
            <div class="changelog" id="changelog">正在获取最新版本信息...</div>
            <a href="#" class="download-btn" id="download-btn">下载最新版 APK</a>
        </div>

        <div class="features">
            <div class="feature-item">
                <strong>三位一体防御</strong>
                Xposed Hook + 内存守护线程 + Root 脚本
            </div>
            <div class="feature-item">
                <strong>极致轻量</strong>
                体积仅 90KB，零广告，零多余依赖
            </div>
            <div class="feature-item">
                <strong>动态 UI 管理</strong>
                实时勾选保护应用，无需重启系统
            </div>
            <div class="feature-item">
                <strong>CI/CD 自动化</strong>
                云端自动打包，固定签名覆盖安装
            </div>
        </div>

        <div class="footer">
            <p>基于 MIT 协议开源 · 只为对抗流氓系统</p>
            <p class="quote">“买的设备是自己的，自己拥有对该设备的一切权利，厂商无权干涉。”</p>
        </div>
    </div>

    <script>
        
        async function fetchVersionInfo() {
            try {
                const response = await fetch('./version.json');
                if (!response.ok) throw new Error('Network response was not ok');
                const data = await response.json();

                
                document.getElementById('version-badge').textContent = `v${data.version}`;
                document.getElementById('release-date').textContent = data.release_date;
                document.getElementById('changelog').textContent = data.changelog;
                document.getElementById('download-btn').href = data.download_url;
            } catch (error) {
                console.error('获取版本信息失败:', error);
                document.getElementById('changelog').textContent = "无法获取版本信息，请检查网络或查看 GitHub Releases。";
                document.getElementById('download-btn').href = "https://github.com/MikotoNetwork/BatteryWhitelist/releases";
            }
        }

        
        fetchVersionInfo();
    </script>
</body>
</html>
