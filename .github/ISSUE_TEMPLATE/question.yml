name: ❓ 问题 / 求助
description: 安装、Root、LSPosed、脚本、更新或使用问题
title: "[Question]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        请先阅读 README 和搜索现有 Issues。如果问题更适合讨论，请前往 Discussions。

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 Issues，确认没有重复
          required: true
        - label: 我已阅读 README 的安装步骤与验证成功部分
          required: true
        - label: 我已提供必要的设备与环境信息
          required: true

  - type: textarea
    id: question
    attributes:
      label: 你的问题
      description: 清晰描述你想了解的内容
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 相关上下文
      description: 你正在尝试做什么？已经尝试过哪些方法？结果如何？
    validations:
      required: true

  - type: input
    id: module_version
    attributes:
      label: BatteryWhitelist 模块版本
      placeholder: "例如 v1.0.0"
    validations:
      required: false

  - type: input
    id: device_model
    attributes:
      label: 设备型号
      placeholder: "例如 一加 13"
    validations:
      required: false

  - type: input
    id: android_version
    attributes:
      label: Android 版本
      placeholder: "例如 Android 16"
    validations:
      required: false

  - type: input
    id: rom_version
    attributes:
      label: ROM / ColorOS 版本
      placeholder: "例如 ColorOS 16.0.1"
    validations:
      required: false

  - type: dropdown
    id: root_solution
    attributes:
      label: Root 方案
      options:
        - KernelSU
        - Magisk
        - APatch
        - 其他
        - 未 Root
    validations:
      required: false

  - type: input
    id: lsposed_version
    attributes:
      label: LSPosed 版本 / API
      placeholder: "例如 LSPosed 1.9.2 (API 102)"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      render: shell
    validations:
      required: false